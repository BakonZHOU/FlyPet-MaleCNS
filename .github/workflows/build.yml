name: Build and self-test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.read.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Read release version
        id: read
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            [xml]$project = Get-Content ./windows/FlyPet.csproj -Raw
            $version = [string]$project.Project.PropertyGroup.Version
          }
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Unable to determine release version.' }
          "value=$version" >> $env:GITHUB_OUTPUT

  windows:
    needs: version
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build windows/FlyPet.csproj -c Release
      - name: Run simulation self-tests
        shell: pwsh
        run: |
          dotnet .\windows\bin\Release\net8.0-windows\FlyPet.dll --self-test .\test-results-ci
          $result = Get-Content .\test-results-ci\results.json -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw "$($result.failures) self-test(s) failed" }
      - name: Package Windows x64
        shell: pwsh
        run: |
          ./package.ps1 windows-x64 -Version ${{ needs.version.outputs.value }}
      - name: Sign in to Azure for Artifact Signing
        if: github.ref_type == 'tag' && vars.AZURE_ARTIFACT_SIGNING_ENDPOINT != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows executable
        if: github.ref_type == 'tag' && vars.AZURE_ARTIFACT_SIGNING_ENDPOINT != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\releases\latest\windows-x64\FlyPet.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify signature and refresh archive
        if: github.ref_type == 'tag' && vars.AZURE_ARTIFACT_SIGNING_ENDPOINT != ''
        shell: pwsh
        run: |
          $exe = '.\releases\latest\windows-x64\FlyPet.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          if ($signature.Status -ne 'Valid') { throw "Invalid Windows signature: $($signature.Status)" }
          $archive = '.\releases\latest\FlyPet-${{ needs.version.outputs.value }}-windows-x64.zip'
          Compress-Archive -Path '.\releases\latest\windows-x64\*' -DestinationPath $archive -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FlyPet-windows-x64
          path: releases/latest/FlyPet-*-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.label }}
    needs: version
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Apple-Silicon, archs: arm64 }
          - { label: Intel, archs: x86_64 }
          - { label: Universal-2, archs: "arm64 x86_64" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build app and DMG
        env:
          ARCHS: ${{ matrix.archs }}
          VERSION: ${{ needs.version.outputs.value }}
        run: ./macos/build.sh
      - name: Verify bundle
        run: |
          file .build/macos/FlyPet.app/Contents/MacOS/FlyPet
          codesign --verify --deep --strict .build/macos/FlyPet.app
          test -f .build/macos/FlyPet.app/Contents/Resources/FlyPet.icns
          engine=.build/macos/FlyPet.app/Contents/Resources/engine-${{ matrix.archs == 'x86_64' && 'x86_64' || 'arm64' }}/FlyPet.Engine
          test -x "$engine"
          printf '{"dt":0.008,"left":0,"top":0,"width":1440,"height":900,"mouseX":-5000,"mouseY":-5000,"threat":false}\n' | "$engine" > .build/macos/engine-reply.json
          grep '"neurons":16711' .build/macos/engine-reply.json
          grep '"edges":2075126' .build/macos/engine-reply.json
      - uses: actions/upload-artifact@v4
        with:
          name: FlyPet-macOS-${{ matrix.label }}
          path: releases/latest/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: FlyPet-macOS-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: FlyPet-windows-x64
          path: release
      - name: Prepare release notes
        shell: pwsh
        run: |
          $version = '${{ needs.version.outputs.value }}'
          $lines = Get-Content ./CHANGELOG.md
          $start = [Array]::FindIndex($lines, [Predicate[string]]{ param($line) $line -match "^## \[$([regex]::Escape($version))\]" })
          if ($start -lt 0) { throw "CHANGELOG.md does not contain version $version." }
          $end = $lines.Length
          for ($i = $start + 1; $i -lt $lines.Length; $i++) {
            if ($lines[$i] -match '^## \[') { $end = $i; break }
          }
          $lines[$start..($end - 1)] | Set-Content ./release-notes.md -Encoding utf8
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
          body_path: release-notes.md

