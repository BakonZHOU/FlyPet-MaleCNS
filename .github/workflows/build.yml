name: Build and self-test

env:
  RELEASE_VERSION: 1.1.0

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build windows/FlyPet.csproj -c Release
      - name: Run simulation self-tests
        shell: pwsh
        run: |
          dotnet .\windows\bin\Release\net8.0-windows\FlyPet.dll --self-test .\test-results-ci
          $result = Get-Content .\test-results-ci\results.json -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw "$($result.failures) self-test(s) failed" }
      - name: Package Windows x64
        shell: pwsh
        run: |
          ./package.ps1 windows-x64 -Version ${{ env.RELEASE_VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: FlyPet-windows-x64
          path: releases/latest/FlyPet-*-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.label }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Apple-Silicon, archs: arm64 }
          - { label: Intel, archs: x86_64 }
          - { label: Universal-2, archs: "arm64 x86_64" }
    steps:
      - uses: actions/checkout@v4
      - name: Build app and DMG
        env:
          ARCHS: ${{ matrix.archs }}
          VERSION: ${{ env.RELEASE_VERSION }}
        run: ./macos/build.sh
      - name: Verify bundle
        run: |
          file .build/macos/FlyPet.app/Contents/MacOS/FlyPet
          codesign --verify --deep --strict .build/macos/FlyPet.app
          test -f .build/macos/FlyPet.app/Contents/Resources/FlyPet.icns
      - uses: actions/upload-artifact@v4
        with:
          name: FlyPet-macOS-${{ matrix.label }}
          path: releases/latest/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FlyPet-macOS-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: FlyPet-windows-x64
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
          body: |
            ## 下载

            | 设备 | 文件 |
            | --- | --- |
            | Windows 10/11（Intel/AMD） | `FlyPet-${{ env.RELEASE_VERSION }}-windows-x64.zip` |
            | Mac（M 系列芯片） | `FlyPet-${{ env.RELEASE_VERSION }}-macOS-arm64.dmg` |
            | Intel Mac | `FlyPet-${{ env.RELEASE_VERSION }}-macOS-x86_64.dmg` |
            | 不确定 Mac 芯片 | `FlyPet-${{ env.RELEASE_VERSION }}-macOS-arm64-x86_64.dmg` |

            Windows 解压后双击 `FlyPet.exe`。Mac 打开 DMG 后将应用拖入“应用程序”。

            macOS 首次打开如出现安全提示，请在 Finder 中按住 Control 点按应用，再选择“打开”。

